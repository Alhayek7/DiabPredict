name: diab_predict
description: نظام ذكي للتنبؤ المبكر بخطر السكري
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  share_plus: ^7.0.0

  crypto: ^3.0.3

  
  hive_flutter: ^1.1.0
  hive: ^2.2.3 
  offline_sync_helper: ^1.0.1
  restart_app: ^1.1.0
  flutter_local_notifications: ^17.0.0
  provider: ^6.1.2


  file_picker: ^8.0.0

  path_provider: ^2.1.2

  # UI
  cupertino_icons: ^1.0.6
  
  # Storage
  shared_preferences: ^2.5.5
  
  # Networking
  # http: ^1.1.0
  http: ^1.2.0
  
  # Charts
  fl_chart: ^0.66.0
  
  # Connectivity
  connectivity_plus: ^5.0.2
  # connectivity_plus: ^6.0.0

  
  # Utilities
  url_launcher: ^6.2.5
  
  # ✅ إضافة دعم اللغة العربية
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.8      
  hive_generator: ^2.0.1    

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/logo.png
    - assets/images/team/
  
  # ✅ إضافة الخطوط المحلية (بدون تكرار)
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700